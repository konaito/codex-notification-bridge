<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex | 入力</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        color: #1b2330;
        background: #f1f3f5;
        font-synthesis: none;
        --ink: #17202c;
        --muted: #748094;
        --quiet: #9aa4b4;
        --line: #dfe4eb;
        --line-soft: #e8ebf0;
        --paper: #fbfbfc;
        --accent: #5268d5;
        --accent-soft: #eef2ff;
      }
      * { box-sizing: border-box; }
      html { min-height: 100%; background: #f1f3f5; }
      body { min-width: 0; min-height: 100vh; margin: 0; overflow-x: hidden; background: #f1f3f5; }
      button, input, textarea { font: inherit; }
      button { border: 0; }
      .app-window { min-height: 100vh; background: #f1f3f5; }
      .app-header { padding: 17px 28px 16px; border-bottom: 1px solid var(--line); background: var(--paper); }
      .header-top { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 20px; }
      .header-copy { min-width: 0; }
      .header-title { display: flex; min-width: 0; align-items: baseline; gap: 12px; }
      .header-actions { display: flex; align-items: center; gap: 10px; }
      .header-actions { padding-top: 0; }
      .sync-state { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); font-size: 11px; }
      .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #40ad78; }
      .sync-dot.loading { background: #d99532; animation: pulse 1s infinite alternate; }
      .sync-dot.error { background: #d65c72; }
      @keyframes pulse { to { opacity: .35; } }
      .icon-button { display: inline-grid; width: 34px; height: 34px; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #657187; cursor: pointer; transition: .16s ease; }
      .icon-button:hover { border-color: #a6b4ee; color: var(--accent); background: #f7f8ff; }
      .eyebrow { margin: 0; color: #687386; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: .13em; }
      h1 { margin: 0; color: var(--ink); font-size: clamp(27px, 3vw, 32px); line-height: 1; letter-spacing: -.045em; }
      .dashboard { width: min(960px, calc(100vw - 64px)); margin: 0 auto; padding: 24px 0 44px; }
      .empty-state, .error-state { padding: 34px 20px; color: var(--quiet); text-align: center; font-size: 13px; line-height: 1.6; }
      .error-state { color: #bd5d70; }
      .composer { margin: 0; padding: 0; background: transparent; }
      .composer-title { display: flex; min-width: 0; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 11px; }
      .composer-title strong { color: #4a5569; font-size: 13px; font-weight: 750; letter-spacing: .01em; }
      .composer-title span { color: var(--quiet); font-size: 11px; text-align: right; }
      .composer-title span.shortcut-note { color: #687386; }
      .composer-title span.shortcut-note.unavailable { color: #bd5d70; }
      .message-input { display: block; width: 100%; min-height: 132px; padding: 16px 17px; border: 1px solid #bcc7d7; border-radius: 8px; outline: none; resize: vertical; background: #fff; color: #252d3c; box-shadow: 0 1px 0 rgba(35, 47, 66, .03); font-size: 16px; line-height: 1.65; transition: border-color .16s ease, box-shadow .16s ease; }
      .message-input::placeholder { color: #aab4c3; }
      .message-input:focus { border-color: #8c9fea; box-shadow: 0 0 0 3px rgba(82, 104, 213, .13); }
      .route-state { display: flex; min-width: 0; align-items: baseline; gap: 8px; min-height: 20px; margin-top: 11px; color: #6d7890; font-size: 11px; }
      .route-state.empty { visibility: hidden; }
      .route-state.pending { color: #a9701f; }
      .route-state.ready { color: var(--accent); }
      .route-state.error { color: #bd5d70; }
      .route-arrow { flex: 0 0 auto; color: currentColor; font-size: 15px; line-height: 1; }
      .route-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .route-note { overflow: hidden; color: var(--quiet); text-overflow: ellipsis; white-space: nowrap; }
      .route-state.ready .route-note { color: #7e8be1; }
      .candidate-header { display: flex; min-width: 0; align-items: baseline; justify-content: space-between; gap: 16px; margin: 24px 0 0; padding: 0 0 10px; border-bottom: 1px solid var(--line); }
      .candidate-header strong { display: inline-flex; align-items: center; gap: 9px; color: #4a5569; font-size: 14px; font-weight: 750; letter-spacing: -.01em; }
      .candidate-header strong::before { width: 3px; height: 15px; background: var(--accent); content: ""; }
      .candidate-header span { overflow: hidden; color: var(--quiet); text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
      .candidate-header span.prediction-loading { color: #a9701f; }
      .candidate-header span.prediction-ready { color: var(--accent); }
      .candidate-header span.prediction-error { color: #bd5d70; }
      .candidate-list { display: grid; grid-template-columns: minmax(0, 1fr); max-height: 430px; gap: 0; overflow-y: auto; border-bottom: 1px solid var(--line); scrollbar-color: #c5ccda transparent; scrollbar-width: thin; }
      .candidate-list::-webkit-scrollbar { width: 8px; }
      .candidate-list::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 10px; background: #c5ccda; background-clip: padding-box; }
      .candidate { display: flex; width: 100%; min-width: 0; align-items: center; gap: 12px; padding: 14px 8px 14px 5px; border: 0; border-bottom: 1px solid var(--line-soft); border-left: 3px solid transparent; border-radius: 0; background: transparent; color: #303949; text-align: left; cursor: pointer; transition: background .14s ease, border-color .14s ease; }
      .candidate:last-child { border-bottom: 0; }
      .candidate:hover { background: #f8f9fb; }
      .candidate.selected { border-left-color: var(--accent); background: var(--accent-soft); }
      .candidate-arrow { width: 16px; flex: 0 0 auto; color: #7181d9; font-size: 20px; line-height: 1; text-align: center; }
      .candidate-info { min-width: 0; flex: 1; }
      .candidate-main { display: flex; min-width: 0; align-items: baseline; gap: 8px; }
      .candidate-project { overflow: hidden; max-width: 34%; color: #687386; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; }
      .candidate-separator { color: #b2bac7; }
      .candidate-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 680; letter-spacing: -.01em; }
      .candidate-sub { display: flex; flex-wrap: wrap; gap: 0 7px; margin-top: 4px; color: #98a3b4; font-size: 11px; }
      .candidate-preview { display: block; overflow: hidden; margin-top: 5px; color: #69758b; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; line-height: 1.35; }
      .candidate-send { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 5px; padding: 8px 4px 8px 12px; color: var(--accent); font-size: 11px; font-weight: 750; }
      .candidate:hover .candidate-send { color: #3f55c4; }
      .candidate.selected .candidate-send { color: #4056c7; }
      .composer-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 13px; }
      .keyboard-hint { color: var(--quiet); font-size: 11px; }
      .keyboard-hint kbd { display: inline-block; min-width: 18px; margin: 0 2px; padding: 2px 5px; border: 1px solid #d5dbe5; border-radius: 4px; background: #fff; color: #707c90; font-size: 10px; text-align: center; }
      .message-status { min-height: 18px; color: #6f7b8f; font-size: 11px; text-align: right; }
      .message-status.success { color: #39875a; }
      .message-status.error { color: #bd5d70; }
      @media (max-width: 540px) {
        .app-header { padding-right: 20px; padding-left: 20px; }
        .header-top { flex-direction: column; gap: 14px; }
        .header-actions { padding-top: 0; }
        .dashboard { width: calc(100vw - 40px); }
        .composer-title { align-items: flex-start; gap: 5px; }
        .composer-title span { text-align: left; }
        .candidate-project { max-width: 28%; }
        .candidate-send { padding-left: 8px; }
        .composer-footer { align-items: flex-start; flex-direction: column; gap: 5px; }
        .message-status { width: 100%; text-align: left; }
      }
      @media (max-height: 620px) {
        .app-header { padding-top: 12px; padding-bottom: 15px; }
        h1 { font-size: 28px; }
        .subtitle { margin-top: 6px; font-size: 12px; }
        .dashboard { padding-top: 20px; padding-bottom: 28px; }
        .message-input { min-height: 100px; }
        .candidate-header { margin-top: 20px; }
        .candidate-list { max-height: 250px; }
      }
    </style>
  </head>
  <body>
    <main class="app-window">
      <header class="app-header">
        <div class="header-top">
          <div class="header-copy">
            <div class="header-title">
              <p class="eyebrow">CODEX</p>
              <h1>入力</h1>
            </div>
          </div>
          <div class="header-actions">
            <span class="sync-state"><i id="sync-dot" class="sync-dot"></i><span id="sync-label">接続準備中</span></span>
            <button id="refresh" class="icon-button" type="button" aria-label="タスク一覧を更新" title="タスク一覧を更新">↻</button>
          </div>
        </div>
      </header>

      <section class="dashboard" aria-label="入力と進行中の作業">
        <section class="composer" aria-label="入力">
          <div class="composer-title"><strong>入力</strong><span id="shortcut-note" class="shortcut-note">左⌘長押しでフォーカス</span></div>
          <textarea id="message" class="message-input" aria-label="入力" maxlength="10000" placeholder="そのまま…"></textarea>
          <div id="route-state" class="route-state empty" aria-live="polite"><span class="route-arrow">→</span><span id="route-label" class="route-label"></span><span id="route-note" class="route-note"></span></div>
          <div class="candidate-header"><strong id="candidate-heading">いまの作業</strong><span id="candidate-note">最近のやり取りが新しい順</span></div>
          <div id="candidate-list" class="candidate-list"><div class="empty-state">同期中…</div></div>
          <div class="composer-footer">
            <div class="keyboard-hint"><kbd>↑</kbd><kbd>↓</kbd> 候補を選択　<kbd>⌘</kbd><kbd>Enter</kbd> 送信</div>
            <div id="message-status" class="message-status" role="status" aria-live="polite"></div>
          </div>
        </section>

      </section>
    </main>

    <script src="./ranking.js"></script>
    <script>
      const state = { threads: [], message: "", selectedId: "", defaultTarget: null, loading: false, error: "", prediction: { status: "idle", rankedIds: [], confidence: 0, reason: "", contextSource: "metadata", contextError: "" } };
      let predictionTimer = null;
      let predictionRequest = 0;
      const $ = selector => document.querySelector(selector);
      const candidateList = $("#candidate-list");
      const messageInput = $("#message");
      const messageStatus = $("#message-status");
      const shortcutNote = $("#shortcut-note");
      const candidateHeading = $("#candidate-heading");
      const routeState = $("#route-state");
      const routeLabel = $("#route-label");
      const routeNote = $("#route-note");

      function setShortcutStatus(status) {
        if (status?.available) {
          shortcutNote.textContent = "左⌘長押しでフォーカス";
          shortcutNote.className = "shortcut-note";
        } else if (status?.message) {
          shortcutNote.textContent = status.message;
          shortcutNote.className = "shortcut-note unavailable";
        }
      }

      window.bridge.onFocusComposer(() => {
        messageInput.focus({ preventScroll: true });
        const cursor = messageInput.value.length;
        messageInput.setSelectionRange(cursor, cursor);
      });
      window.bridge.onShortcutStatus(setShortcutStatus);

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>'"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character]);
      }

      function formatRelative(seconds) {
        if (!seconds) return "—";
        const delta = Math.max(0, Math.floor(Date.now() / 1000 - seconds));
        if (delta < 60) return "たった今";
        if (delta < 3600) return `${Math.floor(delta / 60)}分前`;
        if (delta < 86_400) return `${Math.floor(delta / 3600)}時間前`;
        if (delta < 604_800) return `${Math.floor(delta / 86_400)}日前`;
        return new Date(seconds * 1000).toLocaleDateString("ja-JP", { month: "short", day: "numeric" });
      }

      function setSync(status, label) {
        $("#sync-dot").className = `sync-dot ${status === "loading" ? "loading" : status === "error" ? "error" : ""}`;
        $("#sync-label").textContent = label;
      }

      function compactPreview(value, limit = 120) {
        const preview = String(value || "").replace(/\s+/g, " ").trim();
        if (!preview) return "";
        return preview.length > limit ? `${preview.slice(0, limit - 1)}…` : preview;
      }

      function renderRouteState() {
        const message = state.message.trim();
        const target = state.threads.find(thread => thread.id === state.selectedId);
        routeState.className = "route-state";
        if (!message) {
          routeState.classList.add("empty");
          routeLabel.textContent = "";
          routeNote.textContent = "";
          return;
        }
        if (!target) {
          routeState.classList.add("error");
          routeLabel.textContent = "送り先候補なし";
          routeNote.textContent = "";
          return;
        }
        routeLabel.textContent = target.name;
        if (state.prediction.status === "ready") {
          routeState.classList.add("ready");
          routeNote.textContent = "文脈から選択";
        } else if (state.prediction.status === "loading") {
          routeState.classList.add("pending");
          routeNote.textContent = "候補を更新中…";
        } else if (state.prediction.status === "error") {
          routeState.classList.add("error");
          routeNote.textContent = "近い作業から選択";
        } else {
          routeState.classList.add("pending");
          routeNote.textContent = "候補";
        }
      }

      function localCandidateThreads() {
        return CodexRanking.rankThreads(state.threads, state.message, state.threads.length);
      }

      function modelCandidateThreads() {
        const byId = new Map(state.threads.map(thread => [thread.id, thread]));
        return state.prediction.rankedIds.map(id => byId.get(id)).filter(Boolean);
      }

      function candidateThreadsForDisplay() {
        if ((state.prediction.status === "ready" || state.prediction.status === "loading") && state.prediction.rankedIds.length) {
          return modelCandidateThreads();
        }
        return localCandidateThreads();
      }

      function renderCandidates() {
        const matchingThreads = candidateThreadsForDisplay();
        const candidates = matchingThreads.slice(0, 100);
        const candidateNote = $("#candidate-note");
        candidateHeading.textContent = state.message.trim() ? "送り先候補" : "いまの作業";
        candidateNote.className = "";
        candidateNote.title = "";
        const hasRetainedModelResult = state.prediction.rankedIds.length > 0 && state.prediction.status === "loading";
        if (state.loading) {
          candidateNote.textContent = "Codexの作業中セッションを取得中…";
          candidateNote.className = "prediction-loading";
        } else if (!state.message.trim()) {
          candidateNote.textContent = `${matchingThreads.length}件・最近のやり取りが新しい順`;
        } else if (state.prediction.status === "loading") {
          candidateNote.textContent = hasRetainedModelResult
            ? "候補を保持・入力を再判定中…"
            : "入力をもとに候補を判定中…";
          candidateNote.className = "prediction-loading";
        } else if (state.prediction.status === "ready") {
          const confidence = state.prediction.confidence >= 0.01 ? `・確信度 ${Math.round(state.prediction.confidence * 100)}%` : "";
          const semanticCount = state.prediction.rankedIds.filter(id => state.threads.some(thread => thread.id === id)).length;
          const contextLabel = state.prediction.contextSource === "thread" ? "会話文脈込み" : state.prediction.contextSource === "partial" ? "一部会話文脈込み" : "一覧情報のみ";
          candidateNote.textContent = `${contextLabel}・${Math.min(semanticCount, matchingThreads.length)}件${confidence}`;
          candidateNote.className = "prediction-ready";
          candidateNote.title = state.prediction.reason;
        } else if (state.prediction.status === "error") {
          candidateNote.textContent = `${matchingThreads.length}件・近い作業から表示`;
          candidateNote.className = "prediction-error";
          candidateNote.title = state.prediction.reason;
        } else {
          candidateNote.textContent = `${matchingThreads.length}件・入力に合わせて更新`;
        }
        if (!candidates.length) {
          const message = state.error
            ? state.error
            : state.prediction.status === "ready"
              ? "Codexが候補を返しませんでした。入力を調整してください。"
              : state.message.trim()
                ? "候補なし"
                : "進行中の作業はありません。";
          candidateList.innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
          return;
        }
        candidateList.innerHTML = candidates.map((thread, index) => {
          const preview = compactPreview(thread.preview);
          return `
          <button class="candidate ${thread.id === state.selectedId ? "selected" : ""}" type="button" data-candidate-id="${escapeHtml(thread.id)}">
            <span class="candidate-arrow">${thread.id === state.selectedId ? "›" : ""}</span>
            <span class="candidate-info"><span class="candidate-main"><span class="candidate-project">${escapeHtml(thread.project)}</span><span class="candidate-separator">/</span><span class="candidate-name">${escapeHtml(thread.name)}</span></span><span class="candidate-sub"><span>${escapeHtml(thread.statusLabel)}</span><span>最終 ${formatRelative(thread.updatedAt)}</span>${state.message.trim() && index === 0 ? `<span>${state.prediction.status === "ready" ? "候補トップ" : state.prediction.status === "loading" && hasRetainedModelResult ? "前回の候補トップ" : "入力に近い"}</span>` : ""}</span>${preview ? `<span class="candidate-preview">${escapeHtml(preview)}</span>` : ""}</span>
            <span class="candidate-send">↵ 送る</span>
          </button>`;
        }).join("");
        candidateList.querySelectorAll("[data-candidate-id]").forEach(row => row.addEventListener("click", event => {
          const id = row.dataset.candidateId;
          selectThread(id);
          if (event.target.closest(".candidate-send")) sendMessage(id);
        }));
      }

      function render() {
        renderCandidates();
        renderRouteState();
      }

      function selectThread(id) {
        state.selectedId = id;
        messageStatus.textContent = "";
        messageStatus.className = "message-status";
        render();
      }

      function schedulePrediction() {
        if (predictionTimer) clearTimeout(predictionTimer);
        const request = ++predictionRequest;
        const message = state.message.trim();
        if (!message) {
          state.prediction = { status: "idle", rankedIds: [], confidence: 0, reason: "", contextSource: "metadata", contextError: "" };
          renderCandidates();
          return;
        }
        const previousPrediction = state.prediction;
        const hasPriorModelResult = (previousPrediction.status === "ready" || previousPrediction.status === "loading") && previousPrediction.rankedIds.length > 0;
        state.prediction = hasPriorModelResult
          ? { ...previousPrediction, status: "loading" }
          : { status: "loading", rankedIds: [], confidence: 0, reason: "", contextSource: "metadata", contextError: "" };
        renderCandidates();
        predictionTimer = setTimeout(async () => {
          predictionTimer = null;
          try {
            const result = await window.bridge.predictTarget({ message });
            if (request !== predictionRequest) return;
            state.prediction = {
              status: "ready",
              rankedIds: Array.isArray(result?.rankedIds) ? result.rankedIds : [],
              confidence: Number(result?.confidence) || 0,
              reason: typeof result?.reason === "string" ? result.reason : "",
              contextSource: typeof result?.contextSource === "string" ? result.contextSource : "metadata",
              contextError: typeof result?.contextError === "string" ? result.contextError : "",
            };
            const predictedId = state.prediction.rankedIds[0];
            if (predictedId && state.threads.some(thread => thread.id === predictedId)) state.selectedId = predictedId;
            render();
          } catch (error) {
            if (request !== predictionRequest) return;
            state.prediction = { status: "error", rankedIds: [], confidence: 0, reason: error.message, contextSource: "metadata", contextError: "" };
            renderCandidates();
          }
        }, 450);
      }

      async function loadThreads() {
        state.loading = true;
        state.error = "";
        setSync("loading", "同期中…");
        render();
        try {
          const threads = await window.bridge.listThreads();
          state.threads = Array.isArray(threads) ? threads : [];
          const preferred = state.defaultTarget?.thread && state.threads.find(thread => thread.id === state.defaultTarget.thread);
          if (preferred) state.selectedId = preferred.id;
          else if (!state.selectedId || !state.threads.some(thread => thread.id === state.selectedId)) state.selectedId = state.threads[0]?.id || "";
          state.loading = false;
          setSync("ready", `最終同期 ${new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })}`);
        } catch (error) {
          state.loading = false;
          state.error = `Codexの作業中リストを取得できませんでした: ${error.message}`;
          setSync("error", "同期エラー");
        }
        render();
      }

      async function sendMessage(id) {
        const message = messageInput.value.trim();
        const target = state.threads.find(thread => thread.id === id);
        if (!message) {
          messageStatus.textContent = "入力がありません。";
          messageStatus.className = "message-status error";
          messageInput.focus();
          return;
        }
        if (!target) return;
        messageStatus.textContent = `${target.name} へ送信中…`;
        messageStatus.className = "message-status";
        try {
          await window.bridge.queueToCodex({ thread: target.id, message });
          messageInput.value = "";
          state.message = "";
          predictionRequest += 1;
          if (predictionTimer) clearTimeout(predictionTimer);
          state.prediction = { status: "idle", rankedIds: [], confidence: 0, reason: "", contextSource: "metadata", contextError: "" };
          state.selectedId = target.id;
          messageStatus.textContent = `「${target.name}」へ送りました。`;
          messageStatus.className = "message-status success";
          renderCandidates();
        } catch (error) {
          messageStatus.textContent = `送信失敗: ${error.message}`;
          messageStatus.className = "message-status error";
        }
      }

      $("#refresh").addEventListener("click", loadThreads);
      messageInput.addEventListener("input", event => {
        const nextMessage = event.target.value;
        state.message = nextMessage;
        const hasPriorModelResult = (state.prediction.status === "ready" || state.prediction.status === "loading") && state.prediction.rankedIds.length > 0;
        if (state.message.trim() && !hasPriorModelResult) {
          const matchingThreads = localCandidateThreads();
          state.selectedId = matchingThreads[0]?.id || "";
        }
        schedulePrediction();
        render();
      });
      messageInput.addEventListener("keydown", event => {
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          const candidates = candidateThreadsForDisplay().slice(0, 100);
          if (!candidates.length) return;
          event.preventDefault();
          const currentIndex = candidates.findIndex(thread => thread.id === state.selectedId);
          const direction = event.key === "ArrowDown" ? 1 : -1;
          const nextIndex = currentIndex < 0 ? 0 : (currentIndex + direction + candidates.length) % candidates.length;
          selectThread(candidates[nextIndex].id);
          return;
        }
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          event.preventDefault();
          const target = state.selectedId || candidateThreadsForDisplay()[0]?.id;
          if (target) sendMessage(target);
        }
      });

      async function initialize() {
        try {
          state.defaultTarget = await window.bridge.getDefaultTarget();
        } catch {
          state.defaultTarget = null;
        }
        await loadThreads();
      }

      initialize();
    </script>
  </body>
</html>
