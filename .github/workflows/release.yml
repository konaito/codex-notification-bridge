name: Build and publish main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  test:
    name: Check and test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: npm run check

      - name: Run tests
        run: npm test

  package:
    name: Package macOS arm64
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package application
        run: npm run package:mac:arm64

      - name: Verify packaged application icon
        shell: bash
        run: |
          app_path="dist/Codex Notification Bridge-darwin-arm64/Codex Notification Bridge.app"
          plist_path="$app_path/Contents/Info.plist"
          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist_path")"
          if [[ "$icon_name" != *.icns ]]; then
            icon_name="$icon_name.icns"
          fi
          packaged_icon="$app_path/Contents/Resources/$icon_name"
          test -f "$packaged_icon"
          cmp assets/codex-notification-bridge.icns "$packaged_icon"

      - name: Create distributable DMG
        shell: bash
        run: |
          mkdir -p release
          app_path="dist/Codex Notification Bridge-darwin-arm64/Codex Notification Bridge.app"
          disk_image="release/Codex-Notification-Bridge-macOS-arm64.dmg"
          test -d "$app_path"
          hdiutil create \
            -volname "Codex Notification Bridge" \
            -srcfolder "$app_path" \
            -ov \
            -format UDZO \
            "$disk_image"

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: release/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-dmg
          merge-multiple: true
          path: release

      - name: Publish latest main build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: main-${{ github.sha }}
        run: |
          test -f release/Codex-Notification-Bridge-macOS-arm64.dmg
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Codex Notification Bridge — main ${GITHUB_SHA:0:7}" \
              --notes "Automated build from main commit ${GITHUB_SHA}." \
              --latest
          fi
